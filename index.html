<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Task Manager</title>
  <style>
    :root{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--text:#20242c;--muted:#858b98;--line:#e8ebef;--accent:#356ae6;--accent-hover:#2859ca;--soft:#f1f4f9;--danger:#d94c4c;--success:#26966b;}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:64px 20px}
    .app{width:min(100%,620px);margin:0 auto}
    header{margin-bottom:28px}
    h1{font-size:30px;line-height:1.2;letter-spacing:-1px;margin:0;font-weight:750}
    .subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 28px #18243b08}
    .add-form{display:flex;gap:10px}
    .task-input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;color:var(--text);outline:none;background:#fff}
    .task-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #356ae61a}
    button{font:inherit;cursor:pointer}
    .add-button{height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:650}
    .add-button:hover{background:var(--accent-hover)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
    .count{font-size:13px;color:var(--muted)}
    .filters{display:flex;gap:3px;background:var(--soft);padding:4px;border-radius:9px}
    .filter{border:0;background:transparent;color:var(--muted);font-size:12px;padding:7px 10px;border-radius:6px}
    .filter.active{background:#fff;color:var(--text);box-shadow:0 1px 3px #18243b14;font-weight:650}
    .task-list{list-style:none;padding:0;margin:0}
    .task{display:flex;align-items:center;gap:12px;padding:14px 2px;border-top:1px solid var(--line)}
    .task:first-child{border-top:0}
    .check{width:20px;height:20px;flex:0 0 20px;border:1.5px solid #c8ced8;border-radius:6px;background:#fff;color:#fff;display:grid;place-items:center;padding:0;font-size:13px}
    .task.done .check{background:var(--success);border-color:var(--success)}
    .task-title{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:520}
    .task.done .task-title{color:#9aa0aa;text-decoration:line-through}
    .actions{display:flex;gap:4px}
    .action{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#9299a5;font-size:17px}
    .action:hover{background:var(--soft);color:var(--accent)}
    .action.delete:hover{color:var(--danger)}
    .empty{text-align:center;padding:34px 10px;color:var(--muted);font-size:14px}
    .empty strong{display:block;color:var(--text);font-weight:600;margin-bottom:4px}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px;color:var(--muted);font-size:12px}
    .clear{border:0;background:none;color:var(--accent);padding:5px 0;font-size:12px}
    .message{margin-top:14px;padding:10px 12px;border-radius:9px;background:#eef3ff;color:#2859ca;font-size:13px}
    .message.error{background:#fff0f0;color:var(--danger)}
    dialog{width:min(420px,calc(100% - 28px));border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff;color:var(--text);box-shadow:0 20px 70px #17203330}
    dialog::backdrop{background:#17203366}
    .dialog-title{font-size:18px;margin:0 0 14px}
    .dialog-input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;outline:none}
    .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
    .secondary{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px 14px}
    .save{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:9px 15px;font-weight:600}
    @media(max-width:520px){body{padding:38px 14px}.card{padding:15px}.add-form{flex-direction:column}.add-button{width:100%}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%}.filter{flex:1}.task{gap:9px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Мои задачи</h1>
      <p class="subtitle">Все под контролем.</p>
    </header>

    <section class="card" aria-label="Список задач">
      <form class="add-form" id="add-form">
        <input class="task-input" id="task-title" maxlength="240" placeholder="Что нужно сделать?" aria-label="Новая задача" required>
        <button class="add-button" type="submit">Добавить</button>
      </form>

      <div class="toolbar">
        <span class="count" id="count">0 задач</span>
        <nav class="filters" aria-label="Фильтр задач">
          <button class="filter active" type="button" data-filter="all">Все</button>
          <button class="filter" type="button" data-filter="active">Активные</button>
          <button class="filter" type="button" data-filter="completed">Выполненные</button>
        </nav>
      </div>

      <ul class="task-list" id="task-list"></ul>
      <div class="footer">
        <span id="summary">Пока нет задач</span>
        <button class="clear" id="clear-completed" type="button" hidden>Удалить выполненные</button>
      </div>
      <div class="message" id="message" role="status" hidden></div>
    </section>
  </main>

  <dialog id="edit-dialog">
    <form id="edit-form">
      <h2 class="dialog-title">Изменить задачу</h2>
      <input class="dialog-input" id="edit-title" maxlength="240" required aria-label="Название задачи">
      <div class="dialog-actions">
        <button class="secondary" id="cancel-edit" type="button">Отмена</button>
        <button class="save" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script>
    const API = '/api/tasks';
    const list = document.getElementById('task-list');
    const addForm = document.getElementById('add-form');
    const titleInput = document.getElementById('task-title');
    const message = document.getElementById('message');
    const editDialog = document.getElementById('edit-dialog');
    let tasks = [];
    let currentFilter = 'all';
    let editingTask = null;

    async function request(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        let detail = `Ошибка сервера: ${response.status}`;
        try { const body = await response.json(); detail = body.detail || body.message || detail; } catch (_) {}
        throw new Error(detail);
      }
      return response.status === 204 ? null : response.json();
    }

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = 'message' + (isError ? ' error' : '');
      message.hidden = false;
      if (!isError) setTimeout(() => { message.hidden = true; }, 2500);
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    async function loadTasks() {
      try {
        tasks = await request(API);
        render();
      } catch (error) {
        showMessage('Не удалось загрузить задачи. ' + error.message, true);
      }
    }

    function render() {
      const completed = tasks.filter(task => task.completed).length;
      const active = tasks.length - completed;
      document.getElementById('count').textContent = `${tasks.length} задач`;
      document.getElementById('summary').textContent = tasks.length
        ? `${active} активных · ${completed} выполнено`
        : 'Пока нет задач';
      document.getElementById('clear-completed').hidden = completed === 0;
      list.replaceChildren();

      const visible = tasks.filter(task => currentFilter === 'all'
        || (currentFilter === 'active' && !task.completed)
        || (currentFilter === 'completed' && task.completed));

      if (!visible.length) {
        const empty = makeElement('li', 'empty');
        const heading = makeElement('strong', '', tasks.length ? 'Здесь пока пусто' : 'Добавьте первую задачу');
        const note = makeElement('span', '', tasks.length ? 'В этом фильтре нет задач.' : 'Введите задачу в поле выше.');
        empty.append(heading, note);
        list.append(empty);
        return;
      }

      visible.forEach(task => {
        const row = makeElement('li', 'task' + (task.completed ? ' done' : ''));
        const checkbox = makeElement('button', 'check', task.completed ? '✓' : '');
        checkbox.type = 'button';
        checkbox.setAttribute('aria-label', task.completed ? 'Вернуть задачу в активные' : 'Завершить задачу');
        checkbox.title = checkbox.getAttribute('aria-label');
        checkbox.addEventListener('click', () => perform(`${API}/${task.id}/toggle`, { method: 'PATCH' }));

        const name = makeElement('span', 'task-title', task.title);
        const actions = makeElement('div', 'actions');
        const edit = makeElement('button', 'action', '✎');
        edit.type = 'button';
        edit.title = 'Редактировать';
        edit.setAttribute('aria-label', 'Редактировать задачу');
        edit.addEventListener('click', () => openEdit(task));
        const remove = makeElement('button', 'action delete', '×');
        remove.type = 'button';
        remove.title = 'Удалить';
        remove.setAttribute('aria-label', 'Удалить задачу');
        remove.addEventListener('click', () => deleteTask(task));
        actions.append(edit, remove);
        row.append(checkbox, name, actions);
        list.append(row);
      });
    }

    async function perform(url, options) {
      try { await request(url, options); await loadTasks(); }
      catch (error) { showMessage(error.message, true); }
    }

    async function deleteTask(task) {
      if (!confirm(`Удалить задачу «${task.title}»?`)) return;
      await perform(`${API}/${task.id}`, { method: 'DELETE' });
    }

    function openEdit(task) {
      editingTask = task;
      document.getElementById('edit-title').value = task.title;
      editDialog.showModal();
      document.getElementById('edit-title').focus();
    }

    document.getElementById('cancel-edit').addEventListener('click', () => editDialog.close());
    document.getElementById('edit-form').addEventListener('submit', async event => {
      event.preventDefault();
      const title = document.getElementById('edit-title').value.trim();
      if (!title || !editingTask) return;
      try {
        await request(`${API}/${editingTask.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            priority: editingTask.priority || 'medium',
            category: editingTask.category || 'Личное',
            dueDate: editingTask.dueDate || null
          })
        });
        editDialog.close();
        editingTask = null;
        await loadTasks();
        showMessage('Задача обновлена');
      } catch (error) { showMessage(error.message, true); }
    });

    addForm.addEventListener('submit', async event => {
      event.preventDefault();
      const title = titleInput.value.trim();
      if (!title) return;
      try {
        await request(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        titleInput.value = '';
        currentFilter = 'all';
        document.querySelectorAll('.filter').forEach(button => button.classList.toggle('active', button.dataset.filter === 'all'));
        await loadTasks();
        titleInput.focus();
      } catch (error) { showMessage(error.message, true); }
    });

    document.querySelectorAll('.filter').forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
        render();
      });
    });

    document.getElementById('clear-completed').addEventListener('click', async () => {
      const count = tasks.filter(task => task.completed).length;
      if (!count || !confirm(`Удалить выполненные задачи (${count})?`)) return;
      try {
        await request(`${API}/completed`, { method: 'DELETE' });
        await loadTasks();
        showMessage('Выполненные задачи удалены');
      } catch (error) { showMessage(error.message, true); }
    });

    loadTasks();
  </script>
</body>
</html>
